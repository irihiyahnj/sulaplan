name: build-images

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "deployments/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: vendor/plane/apps/web/Dockerfile.web
            context: vendor/plane
          - service: space
            dockerfile: vendor/plane/apps/space/Dockerfile.space
            context: vendor/plane
          - service: admin
            dockerfile: vendor/plane/apps/admin/Dockerfile.admin
            context: vendor/plane
          - service: live
            dockerfile: vendor/plane/apps/live/Dockerfile.live
            context: vendor/plane
          - service: api
            dockerfile: vendor/plane/apps/api/Dockerfile.api
            context: vendor/plane/apps/api
          - service: proxy
            dockerfile: vendor/plane/apps/proxy/Dockerfile.ce
            context: vendor/plane/apps/proxy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/sulaplan-${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
