# plan.sula.page —— sulaplan(Plane 项目管理)
# 反代到 plane-proxy(Caddy)容器内网 8080;TLS 由宿主 nginx + Let's Encrypt 终结。
# 2026-08-12 上线, 与 sula.page 同模式(CF DNS-only + certbot HTTP-01)。

server {
    listen 80;
    listen [::]:80;
    server_name plan.sula.page;

    # ACME challenge 走 webroot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://plan.sula.page$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plan.sula.page;

    ssl_certificate     /etc/letsencrypt/live/plan.sula.page/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plan.sula.page/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;

    access_log /var/log/nginx/plan.sula.page.access.log;
    error_log  /var/log/nginx/plan.sula.page.error.log;

    # Plane 使用 WebSocket(live 实时),必须升级
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
